<!-- PixelOS Pro – Advanced Retro Web OS (single-file) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PixelOS Pro — Advanced Retro Web OS</title>
  <style>
    /* ---- Theme & base ---- */
    :root{
      --font: "Press Start 2P", "Courier New", monospace;
      --bg:#0d1117;
      --teal-desktop:#008080;
      --teal-pattern:#005a5a;
      --window-bg:#c0c0c0;
      --win-border-light:#ffffff;
      --win-border-dark:#555555;
      --title-bar:#000080;
      --title-bar-inactive:#808080;
      --text:#000000;
      --text-inv:#ffffff;
      --glow: rgba(77,192,248,0.7);
      --fs-font-size:0.8rem;
    }
    html,body{height:100%;margin:0}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
      user-select:none;
      font-size:var(--fs-font-size);
    }
    body.theme-dark{
      --teal-desktop:#2a2a2a;
      --teal-pattern:#1a1a1a;
      --window-bg:#3c3c3c;
      --win-border-light:#6a6a6a;
      --win-border-dark:#1a1a1a;
      --title-bar:#002a5a;
      --title-bar-inactive:#4a4a4a;
      --text:#e0e0e0;
      --text-inv:#000;
    }
    body.theme-light{
      --teal-desktop:#add8e6;
      --teal-pattern:#87ceeb;
      --window-bg:#f0f0f0;
      --win-border-light:#ffffff;
      --win-border-dark:#888888;
      --title-bar:#3b5998;
      --title-bar-inactive:#a9a9a9;
      --text:#000;
      --text-inv:#fff;
    }
    body.animations-disabled {
        /* disable animations normally */
        * {
          transition: none !important;
          animation: none !important;
        }
      }
      
      /* Apply when user prefers reduced motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    /* ---- Boot screens ---- */
    #boot-screen, #shutdown-screen {
      position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between;
      background:#000; color:#0f0; padding:20px; box-sizing:border-box; z-index:99999;
      font-size:0.95rem;
    }
    #boot-log{height:calc(100% - 40px); overflow:auto; font-family:monospace;}
    #skip-boot-prompt{color:#ff0; text-align:center; margin-top:6px; animation:blink 1.5s step-end infinite}
    @keyframes blink{50%{opacity:0}}

    /* ---- Desktop ---- */
    #screen{
      position:fixed; inset:0; display:none; background:var(--teal-desktop);
      background-image:
        linear-gradient(45deg,var(--teal-pattern) 25%,transparent 25%),
        linear-gradient(-45deg,var(--teal-pattern) 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,var(--teal-pattern) 75%),
        linear-gradient(-45deg,transparent 75%,var(--teal-pattern) 75%);
      background-size:20px 20px;
      padding:12px; box-sizing:border-box;
    }
    #desktop-icons{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}

    .desktop-icon{
      width:110px; padding:8px; text-align:center; cursor:pointer; color:var(--text-inv);
      border:1px solid transparent; user-select:none; background:transparent;
    }
    .desktop-icon:focus-visible, .desktop-icon:hover{
      outline:none; background:rgba(255,255,255,0.08); border:1px dashed #fff;
    }
    .desktop-icon-svg{width:48px;height:48px;margin:0 auto 6px; pointer-events:none}
    .desktop-icon span{display:block; font-size:0.7rem; color:var(--text-inv)}

    /* ---- Window ---- */
    .window{
      position:absolute; background:var(--window-bg);
      border:2px outset var(--win-border-light);
      min-width:280px; min-height:180px; display:flex; flex-direction:column; overflow:hidden;
      box-shadow:5px 5px 12px rgba(0,0,0,0.6);
    }
    .window.active{box-shadow:0 0 20px var(--glow); z-index:1000}
    .window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 40px)!important;border-radius:0}
    .title-bar{display:flex; align-items:center; justify-content:space-between; padding:4px; cursor:grab; background:var(--title-bar-inactive); color:var(--text-inv); flex-shrink:0}
    .window.active .title-bar{background:var(--title-bar)}
    .title-bar-text{display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden}
    .title-bar-controls{display:flex; gap:4px}
    .title-bar-button{width:20px;height:20px; border:1px outset var(--win-border-light); background:var(--window-bg); cursor:pointer; font-weight:bold; color:var(--text)}
    .title-bar-button:active{border-style:inset}
    .window-content{padding:8px; background:var(--win-border-light); margin:4px; border:1px inset var(--win-border-dark); overflow:auto; display:flex; flex-direction:column; gap:8px}

    .resizer{width:16px;height:16px;position:absolute;right:0;bottom:0;cursor:se-resize}

    /* ---- Taskbar & Start ---- */
    #taskbar{position:fixed; left:0; right:0; bottom:0; height:40px; display:flex; align-items:center; gap:6px; padding:4px; background:var(--window-bg); border-top:2px solid var(--win-border-light); z-index:99999}
    .taskbar-left{display:flex; gap:6px; align-items:center}
    .taskbar-button{padding:6px 10px; border:2px outset var(--win-border-light); background:var(--window-bg); cursor:pointer; font-size:0.75rem; display:flex; align-items:center; gap:6px; max-width:220px; overflow:hidden; text-overflow:ellipsis}
    .taskbar-button.active{border-style:inset}
    #clock{margin-left:auto; padding:6px 8px; border:1px inset var(--win-border-dark); font-size:0.75rem}

    #start-menu{position:fixed; bottom:40px; left:4px; display:none; flex-direction:column; gap:6px; padding:6px; border:2px outset var(--win-border-light); background:var(--window-bg); z-index:100000}

    /* ---- HUD/Toast ---- */
    #hud-indicator{position:fixed; top:10px; right:10px; width:10px; height:10px; border-radius:50%; border:1px solid #fff; background:#f00; z-index:20000}
    #hud-indicator.beat{background:#0f0}
    #toast-container{position:fixed; bottom:50px; right:10px; display:flex; flex-direction:column; gap:6px; z-index:20000}
    .toast{padding:8px; background:var(--title-bar); color:var(--text-inv); border:2px outset var(--win-border-light); font-size:0.75rem; animation:toastfade 5s forwards}
    @keyframes toastfade{0%,100%{opacity:0}10%,90%{opacity:1}}

    /* ---- App styles ---- */
    .app-container{display:flex;flex-direction:column;height:100%}
    .app-toolbar{padding:4px;border-bottom:2px inset var(--win-border-dark);display:flex;justify-content:space-between;align-items:center}
    .app-main{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
    table{width:100%;border-collapse:collapse;font-size:0.75rem}
    th,td{padding:4px;border:1px solid var(--win-border-dark);text-align:left}
    .file-explorer{display:flex;gap:8px;height:100%}
    .file-tree{width:160px;border-right:2px inset var(--win-border-dark);padding-right:6px;overflow:auto}
    .file-list{flex:1;padding-left:6px;overflow:auto}
    .terminal{background:#000;color:#0f0;padding:8px;font-family:monospace;height:100%;display:flex;flex-direction:column}
    .terminal-output{flex:1;overflow:auto;white-space:pre-wrap}
    .terminal-input{display:flex;gap:6px;align-items:center}
    .terminal-input input{flex:1;background:transparent;border:none;color:inherit;outline:none;font-family:monospace}
    .sparkline{width:60px;height:16px}
  </style>
</head>
<body>
  <!-- Boot & shutdown -->
  <div id="boot-screen" role="status" aria-live="polite">
    <div id="boot-log" aria-hidden="false"></div>
    <div style="text-align:center">
      <button id="skip-boot-button" style="padding:8px;margin-bottom:6px">Skip</button>
      <div id="skip-boot-prompt">Press Enter to Skip Boot</div>
    </div>
  </div>
  <div id="shutdown-screen" style="display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:#000080">
    <h2>PixelOS Pro — Shutdown Complete</h2>
    <p>It is now safe to turn off your computer.</p>
  </div>

  <!-- Desktop -->
  <main id="screen" aria-label="PixelOS Desktop">
    <div id="desktop-icons"></div>
    <div id="taskbar">
      <div class="taskbar-left">
        <button id="start-button" class="taskbar-button" aria-haspopup="true" aria-expanded="false">Start</button>
        <div id="tasks-container" style="display:flex;gap:6px"></div>
      </div>
      <div id="clock" aria-live="polite"></div>
    </div>
    <div id="start-menu" role="menu">
      <button role="menuitem" data-action="open-app" data-appid="logviewer">OS Logs</button>
      <button role="menuitem" data-action="open-app" data-appid="settings">Settings</button>
      <button role="menuitem" data-action="shutdown">Shutdown</button>
    </div>
    <div id="hud-indicator" aria-hidden="true"></div>
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  </main>

  <script>
  /* PixelOS Pro — single-file advanced web OS
     - This file contains Kernel, Scheduler, ProcessManager, IPC, FS, Services, UI and Apps
     - It is intentionally modular (namespaced objects & classes)
  */

  (function () {
    "use strict";

    /* ---------------------------
       Kernel & Core (namespaces)
       --------------------------- */
    const Kernel = {
      tickSpeed: 100, // main loop tick (ms)
      scheduler: null,
      processManager: null,
      ipc: null,
      fs: null,
      services: null,
      ui: null,
      _mainLoopId: null,

      logQueue: [],

      async boot() {
        // Create processManager first (so processes can be tracked)
        this.processManager = new ProcessManager();
        // IPC depends on process manager to route messages if needed
        this.ipc = new IPC(this.processManager);
        // Scheduler next
        this.scheduler = new Scheduler(this.processManager);
        // FileSystem (passes IPC optional)
        this.fs = new FileSystem(this.ipc);
        // Services registry (needs kernel)
        this.services = new ServiceRegistry(this);

        // safe logging now
        this.log("Kernel", "Booting PixelOS Pro...");

        // init FS -> then register services and start main loop
        await this.fs.init();
        this.services.registerAll();
        this.services.startAll();

        this.log("Kernel", "Core systems initialized. Starting main loop.");
        // start scheduler main loop
        this._mainLoopId = setInterval(() => this.tick(), this.tickSpeed);
      },

      tick() {
        try {
          this.scheduler.run();      // schedule a slice
          this.services.tick();      // let daemons run periodic logic
        } catch (err) {
          console.error("Kernel tick error:", err);
        }
      },

      // simplified syscall gateway for UI/apps
      syscall(call, ...args) {
        switch (call) {
          case "process.create": return this.processManager.create(...args);
          case "process.terminate": return this.processManager.terminate(...args);
          case "process.get": return this.processManager.get(...args);
          case "process.getAll": return this.processManager.getAll();
          case "process.setState": return this.processManager.setState(...args);
          case "scheduler.setPriority": return this.scheduler.setPriority(...args);
          case "fs.read": return this.fs.read(...args);
          case "fs.write": return this.fs.write(...args);
          case "fs.list": return this.fs.list(...args);
          case "fs.mkdir": return this.fs.mkdir(...args);
          case "fs.exists": return this.fs.exists(...args);
          case "ipc.pub": return this.ipc.pub(...args);
          case "ipc.sub": return this.ipc.sub(...args);
          case "ipc.send": return this.ipc.send(...args);
          default:
            this.log("Kernel", `Unknown syscall: ${call}`, "error");
            return null;
        }
      },

      log(source, message, level = "info") {
        // push into ipc topic for UI viewers
        const logEntry = { source, message, level, ts: new Date() };
        console.log(`[${source}] ${message}`);
        // safely publish (ipc exists)
        if (this.ipc) this.ipc.pub("kernel.log", logEntry);
        else this.logQueue.push(logEntry);
      },

      async shutdown() {
        this.log("Kernel", "Shutdown initiated.");
        clearInterval(this._mainLoopId);
        this.services.stopAll();
        await this.fs.persist();
        return Promise.resolve();
      }
    };

    /* ---------------------------
       Scheduler (preemptive-ish simulation)
       --------------------------- */
    class Scheduler {
      constructor(processManager) {
        this.pm = processManager;
        this.queues = { HIGH: [], NORMAL: [], LOW: [] };
        this.timeSliceTicks = 1; // in kernel ticks (each run() simulates 1 timeslice)
        this.agingCounter = 0;
        this.agingThreshold = 300; // ticks before promoting to avoid starvation
      }

      add(proc) {
        if (!proc || !proc.priority) return;
        const q = this.queues[proc.priority] || this.queues.NORMAL;
        q.push(proc);
      }

      run() {
        // pick next ready process from highest priority
        const proc = this._getNextProcess();
        if (!proc) return;
        if (proc.state === "NEW") proc.state = "READY";

        if (proc.state === "READY") {
          proc.state = "RUNNING";
          // simulate running for one timeslice: increment runTicks
          proc.cpuUsage.runTicks++;
          // after one slice, place it back to READY at proper queue end
          proc.state = "READY";
          // move to end of its queue to implement round-robin
          this._requeue(proc);
        }

        // global bookkeeping
        this.pm.getAll().forEach((p) => {
          p.cpuUsage.totalTicks++;
          p.cpuUsage.history.push(p.state === "RUNNING" ? 1 : 0);
          if (p.cpuUsage.history.length > 60) p.cpuUsage.history.shift();
        });

        this._handleAging();
      }

      _getNextProcess() {
        if (this.queues.HIGH.length) return this.queues.HIGH.shift();
        if (this.queues.NORMAL.length) return this.queues.NORMAL.shift();
        if (this.queues.LOW.length) return this.queues.LOW.shift();
        return null;
      }

      _requeue(proc) {
        (this.queues[proc.priority] || this.queues.NORMAL).push(proc);
      }

      _handleAging() {
        this.agingCounter++;
        if (this.agingCounter >= this.agingThreshold) {
          this.agingCounter = 0;
          const low = this.queues.LOW.shift();
          if (low) {
            low.priority = "NORMAL";
            this.queues.NORMAL.push(low);
            Kernel.log("Scheduler", `Aging: Promoted PID ${low.pid} to NORMAL`);
          }
        }
      }

      setPriority(pid, priority) {
        const proc = this.pm.get(pid);
        if (!proc) return false;
        // remove from all queues
        Object.values(this.queues).forEach(q => {
          const idx = q.findIndex(p => p.pid === pid);
          if (idx > -1) q.splice(idx,1);
        });
        proc.priority = priority;
        this.add(proc);
        Kernel.log("Scheduler", `PID ${pid} set to ${priority}`);
        return true;
      }
    }

    /* ---------------------------
       Process Manager
       --------------------------- */
    class ProcessManager {
      constructor() {
        this.processes = new Map();
        this.nextPID = 1000;
      }

      create(name = "proc", priority = "NORMAL") {
        const pid = this.nextPID++;
        const process = {
          pid, name, priority,
          state: "NEW",
          memory: Math.floor(Math.random() * 41) + 10, // 10-50 MB
          startTime: Date.now(),
          cpuUsage: { runTicks: 0, totalTicks: 0, history: [] },
          messageQueue: [],
          subscriptions: []
        };
        this.processes.set(pid, process);
        // Safely add to scheduler if present
        try { Kernel.scheduler && Kernel.scheduler.add(process); } catch (e) {}
        Kernel.log("ProcessManager", `Created PID ${pid} (${name})`);
        return process;
      }

      terminate(pid) {
        const proc = this.get(pid);
        if (!proc) return false;
        // unsubscribe handlers
        proc.subscriptions.forEach(unsub => { try { unsub(); } catch(e){} });
        this.processes.delete(pid);
        Kernel.log("ProcessManager", `Terminated PID ${pid} (${proc.name})`);
        return true;
      }

      get(pid) { return this.processes.get(pid); }
      getAll() { return [...this.processes.values()]; }
      setState(pid, state) {
        const p = this.get(pid);
        if (p) p.state = state;
      }
    }

    /* ---------------------------
       IPC (simple pub/sub + send)
       --------------------------- */
    class IPC {
      constructor(pm) {
        this.pm = pm;
        this.topics = new Map();
      }
      pub(topic, payload) {
        const handlers = this.topics.get(topic) || [];
        handlers.forEach(h => { try { h(payload); } catch(e){console.error(e);} });
      }
      sub(topic, handler) {
        if (!this.topics.has(topic)) this.topics.set(topic, []);
        this.topics.get(topic).push(handler);
        return () => {
          const hlist = this.topics.get(topic);
          const idx = hlist.indexOf(handler);
          if (idx > -1) hlist.splice(idx,1);
        };
      }
      send(pid, message) {
        const p = this.pm.get(pid);
        if (p) p.messageQueue.push(message);
      }
    }

    /* ---------------------------
       FileSystem (VFS) with persistence (IndexedDB w/ localStorage fallback)
       --------------------------- */
    class FileSystem {
      constructor(ipc) {
        this.vfs = {}; // path -> {path,type,content,modified}
        this.db = null;
        this.ipc = ipc;
        this._persistTimeout = null;
      }

      async init() {
        // attempt IndexedDB
        try {
          const req = indexedDB.open("PixelOS_FS", 1);
          req.onupgradeneeded = e => {
            e.target.result.createObjectStore("files", { keyPath: "path" });
          };
          this.db = await new Promise((res, rej) => {
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
          });
          await this.load();
        } catch (err) {
          Kernel.log("FS", "IndexedDB not available, falling back to localStorage", "error");
          await this.loadFromLocalStorage();
        }
      }

      async load() {
        if (!this.db) return this.loadFromLocalStorage();
        return new Promise((resolve) => {
          const tx = this.db.transaction("files", "readonly");
          const store = tx.objectStore("files");
          const req = store.getAll();
          req.onsuccess = () => {
            if (req.result && req.result.length) {
              req.result.forEach(f => this.vfs[f.path] = f);
              Kernel.log("FS", "Loaded VFS from IndexedDB");
            } else {
              this._createDefaults();
            }
            resolve();
          };
          req.onerror = () => { this._createDefaults(); resolve(); };
        });
      }

      async loadFromLocalStorage() {
        const saved = localStorage.getItem("pixelos.vfs");
        if (saved) {
          this.vfs = JSON.parse(saved);
          Kernel.log("FS", "Loaded VFS from localStorage");
        } else this._createDefaults();
      }

      _createDefaults() {
        Kernel.log("FS", "Creating default VFS");
        this.mkdir("/");
        ["/games","/saves","/system","/tmp"].forEach(p => this.mkdir(p));
        this.write("/system/readme.txt", "Welcome to PixelOS Pro!");
        this.write("/games/AstroSmash.cart", "ASTRO_DATA");
        this.write("/games/PixelQuest.cart", "PIXELQUEST_DATA");
        this._queuePersist();
      }

      // Debounced persist
      _queuePersist() {
        if (this._persistTimeout) clearTimeout(this._persistTimeout);
        this._persistTimeout = setTimeout(() => this.persist(), 500);
      }

      async persist() {
        if (this.db) {
          return new Promise((resolve) => {
            const tx = this.db.transaction("files", "readwrite");
            const store = tx.objectStore("files");
            store.clear();
            Object.values(this.vfs).forEach(file => store.put(file));
            tx.oncomplete = () => {
              Kernel.log("FS", "Persisted VFS to IndexedDB");
              resolve();
            };
            tx.onerror = () => { localStorage.setItem("pixelos.vfs", JSON.stringify(this.vfs)); Kernel.log("FS","Persist fallback to localStorage","error"); resolve(); };
          });
        } else {
          localStorage.setItem("pixelos.vfs", JSON.stringify(this.vfs));
          Kernel.log("FS", "Persisted VFS to localStorage");
        }
      }

      read(path) {
        return this.vfs[path]?.content || "";
      }

      write(path, content) {
        const now = Date.now();
        const parent = path === "/" ? "/" : path.substring(0, path.lastIndexOf("/")) || "/";
        if (!this.vfs[parent] || this.vfs[parent].type !== "folder") {
          this.mkdir(parent);
        }
        this.vfs[path] = { path, content, type: "file", modified: now };
        this._queuePersist();
        return true;
      }

      list(path = "/") {
        // Normalize
        if (path !== "/" && path.endsWith("/")) path = path.slice(0,-1);
        const keys = Object.keys(this.vfs);
        if (path === "/") {
          // immediate children of root (depth 2)
          return keys.filter(p => p.split("/").length === 2);
        }
        const baseDepth = path === "/" ? 1 : path.split("/").length;
        return keys.filter(p => p.startsWith(path + "/") && p.split("/").length === baseDepth + 1);
      }

      mkdir(path) {
        const now = Date.now();
        this.vfs[path] = { path, type: "folder", modified: now };
        this._queuePersist();
        return true;
      }

      exists(path) { return !!this.vfs[path]; }
    }

    /* ---------------------------
       Services (daemons)
       --------------------------- */
    class ServiceRegistry {
      constructor(kernel) {
        this.kernel = kernel;
        this.services = new Map();
      }
      registerAll() {
        this.register("Watchdog", new WatchdogService(this.kernel));
        this.register("NotificationCenter", new NotificationCenterService(this.kernel));
        this.register("AudioMixer", new AudioMixerService(this.kernel));
        this.register("SaveService", new SaveService(this.kernel));
        this.register("NetworkSync", new NetworkSyncService(this.kernel));
        this.register("AssetStreamer", new AssetStreamerService(this.kernel));
      }
      register(name, instance) { this.services.set(name, instance); }
      startAll() { this.services.forEach(s => s.start()); }
      stopAll() { this.services.forEach(s => s.stop()); }
      tick() { this.services.forEach(s => s.tick()); }
      get(name) { return this.services.get(name); }
    }

    class BaseService {
      constructor(kernel, name, priority = "NORMAL") {
        this.kernel = kernel; this.name = name; this.priority = priority;
        this.process = null; this._running = false;
      }
      start() {
        if (this._running) return;
        this.process = this.kernel.processManager.create(`service:${this.name}`, this.priority);
        this._running = true;
        this.kernel.log("Services", `${this.name} started (PID ${this.process.pid})`);
        if (this.onStart) this.onStart();
      }
      stop() {
        if (!this._running) return;
        if (this.onStop) this.onStop();
        if (this.process) this.kernel.processManager.terminate(this.process.pid);
        this._running = false;
        this.kernel.log("Services", `${this.name} stopped`);
      }
      tick() { if (this.onTick) this.onTick(); }
    }

    class WatchdogService extends BaseService {
      constructor(kernel) { super(kernel,"Watchdog","HIGH"); }
      onTick() {
        const zombies = Kernel.processManager.getAll().filter(p => p.state === "ZOMBIE");
        zombies.forEach(z => {
          Kernel.log("Watchdog", `Cleaning ZOMBIE PID ${z.pid}`);
          Kernel.processManager.terminate(z.pid);
        });
      }
    }

    class NotificationCenterService extends BaseService {
      constructor(kernel) { super(kernel,"NotificationCenter"); this.subs=[]; }
      onStart() {
        this.subs.push(this.kernel.ipc.sub("notify.show", payload => this.showToast(payload)));
      }
      onStop() { this.subs.forEach(u=>u()); this.subs=[]; }
      showToast({message, type="info"}) {
        const container = document.getElementById("toast-container");
        if (!container) return;
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = message;
        container.appendChild(t);
        setTimeout(()=> t.remove(), 4800);
      }
    }

    class AudioMixerService extends BaseService {
      constructor(kernel){ super(kernel,"AudioMixer","HIGH"); this._interval=null; }
      onStart(){
        const hud = document.getElementById("hud-indicator");
        this._interval = setInterval(()=>{
          this.kernel.ipc.pub("audio.beat",{ts:Date.now()});
          if (hud) hud.classList.toggle("beat");
        },500);
      }
      onStop(){ if (this._interval) { clearInterval(this._interval); this._interval=null; } }
    }

    class SaveService extends BaseService {
      constructor(kernel){ super(kernel,"SaveService"); this._interval=null; }
      onStart(){
        this._interval = setInterval(()=> this.kernel.ipc.pub("autosave.tick",{}), 10000);
      }
      onStop(){ if(this._interval){ clearInterval(this._interval); this._interval=null; } }
    }

    class NetworkSyncService extends BaseService {
      constructor(kernel){ super(kernel,"NetworkSync"); this.isOffline=false; }
      onStart(){
        this._sub = this.kernel.ipc.sub("net.toggle", ({offline})=>{
          this.isOffline = offline;
          this.kernel.ipc.pub("notify.show",{message:`Network ${offline ? "offline":"online"}`});
        });
      }
      onStop(){ if(this._sub) this._sub(); }
    }

    class AssetStreamerService extends BaseService {
      constructor(kernel){ super(kernel,"AssetStreamer"); }
      onStart(){
        this._sub = this.kernel.ipc.sub("asset.stream", ({path,dest}) => this.stream(path,dest));
      }
      onStop(){ if(this._sub) this._sub(); }
      stream(path,dest){
        const content = this.kernel.fs.read(path);
        if (!content) { this.kernel.ipc.pub("notify.show",{message:`Asset not found: ${path}`}); return; }
        let progress=0;
        const interval = setInterval(()=>{
          progress += 25;
          this.kernel.ipc.pub("notify.show",{message:`Streaming ${path}: ${progress}%`});
          if (progress >= 100) {
            clearInterval(interval);
            this.kernel.fs.write(dest, content);
            this.kernel.ipc.pub("notify.show",{message:`Streamed ${path} → ${dest}`});
          }
        },500);
      }
    }

    /* ---------------------------
       UI: WindowManager & ThemeManager & UI glue
       --------------------------- */
    class WindowManager {
      constructor(screenEl, taskbarEl, processManager) {
        this.screen = screenEl;
        this.taskbar = taskbarEl;
        this.pm = processManager;
        this.windows = new Map(); // pid -> entry
        this.z = 500;
      }

      open(appDef, options = {}) {
        // If appDef is key from APPS, use that
        const app = appDef;
        // If already open by name, focus
        for (const [pid, entry] of this.windows) {
          if (entry.appName === app.name) { this.focus(pid); return pid; }
        }

        // create a process
        const proc = Kernel.syscall("process.create", app.name, options.priority || "NORMAL");
        const pid = proc.pid;

        // create window element
        const win = document.createElement("div");
        win.className = "window";
        win.style.left = (50 + Math.random()*240) + "px";
        win.style.top = (60 + Math.random()*120) + "px";
        win.style.width = options.width || "520px";
        win.style.height = options.height || "360px";
        win.setAttribute("role","dialog");
        win.setAttribute("aria-label", app.name);

        // title bar
        const titleBar = document.createElement("div");
        titleBar.className = "title-bar";
        titleBar.innerHTML = `<div class="title-bar-text">${app.icon || ""}<span>${app.name}</span></div>
                              <div class="title-bar-controls">
                                <button class="title-bar-button" data-act="min" title="Minimize">_</button>
                                <button class="title-bar-button" data-act="max" title="Maximize">☐</button>
                                <button class="title-bar-button" data-act="close" title="Close">x</button>
                              </div>`;
        win.appendChild(titleBar);

        // content
        const content = document.createElement("div");
        content.className = "window-content";
        win.appendChild(content);

        // resizer
        const resizer = document.createElement("div");
        resizer.className = "resizer";
        win.appendChild(resizer);

        // append
        this.screen.appendChild(win);

        // initialize app content
        const result = app.init ? app.init() : { el: document.createElement("div") };
        const appEl = result.el || document.createElement("div");
        content.appendChild(appEl);
        const cleanup = result.cleanup || result.onClose || (()=>{});

        // create taskbar button
        const tbtn = document.createElement("button");
        tbtn.className = "taskbar-button";
        tbtn.textContent = app.name;
        tbtn.dataset.pid = pid;
        document.getElementById("tasks-container").appendChild(tbtn);

        // store entry
        this.windows.set(pid, { winEl: win, appName: app.name, cleanup, taskBtn: tbtn, minimized:false, lastRect:null });

        // wire events
        this._makeDraggable(win, titleBar);
        this._makeResizable(win, resizer);

        titleBar.addEventListener("click", (e) => {
          const act = e.target.closest("[data-act]")?.dataset.act;
          if (!act) return;
          if (act === "close") this.close(pid);
          if (act === "min") this.toggleMinimize(pid);
          if (act === "max") this.maximize(pid);
        });

        tbtn.addEventListener("click", () => this.toggleMinimize(pid));
        win.addEventListener("mousedown", ()=> this.focus(pid));

        // focus newly opened window
        this.focus(pid);
        return pid;
      }

      focus(pid) {
        const entry = this.windows.get(pid); if (!entry) return;
        // deactivate others
        for (const [,e] of this.windows) e.winEl.classList.remove("active");
        entry.winEl.classList.add("active");
        entry.winEl.style.zIndex = ++this.z;
        // taskbar highlight
        for (const [,e] of this.windows) e.taskBtn.classList.remove("active");
        entry.taskBtn.classList.add("active");
      }

      close(pid) {
        const entry = this.windows.get(pid);
        if (!entry) return;
        // cleanup app resources
        try { entry.cleanup && entry.cleanup(); } catch(e) {}
        entry.winEl.remove();
        entry.taskBtn.remove();
        Kernel.syscall("process.terminate", pid);
        this.windows.delete(pid);
      }

      toggleMinimize(pid) {
        const entry = this.windows.get(pid); if (!entry) return;
        if (!entry.minimized) {
          entry.winEl.style.display = "none";
          entry.minimized = true;
          entry.taskBtn.classList.remove("active");
          const p = Kernel.syscall("process.get", pid);
          if (p) p.state = "MINIMIZED";
        } else {
          entry.winEl.style.display = "flex";
          entry.minimized = false;
          this.focus(pid);
          const p = Kernel.syscall("process.get", pid);
          if (p) p.state = "READY";
        }
      }

      maximize(pid) {
        const entry = this.windows.get(pid); if (!entry) return;
        const w = entry.winEl;
        if (!w.classList.contains("maximized")) {
          entry.lastRect = { left:w.style.left, top:w.style.top, width:w.style.width, height:w.style.height };
          w.classList.add("maximized");
        } else {
          w.classList.remove("maximized");
          if (entry.lastRect) {
            w.style.left = entry.lastRect.left;
            w.style.top = entry.lastRect.top;
            w.style.width = entry.lastRect.width;
            w.style.height = entry.lastRect.height;
          }
        }
      }

      getTopmostPID(){
        let top=null, topZ=-1;
        for (const [pid,entry] of this.windows){
          const z = parseInt(entry.winEl.style.zIndex||0);
          if (z>topZ){ top=pid; topZ=z; }
        }
        return top;
      }

      _makeDraggable(win, titleBar){
        let dragging=false, offX=0, offY=0;
        const onMove = (e)=>{
          if(!dragging) return;
          const x = e.clientX - offX;
          const y = e.clientY - offY;
          const maxX = window.innerWidth - win.offsetWidth;
          const maxY = window.innerHeight - win.offsetHeight - 40;
          win.style.left = Math.max(0, Math.min(x, maxX)) + "px";
          win.style.top  = Math.max(0, Math.min(y, maxY)) + "px";
        };
        titleBar.addEventListener("mousedown",(e)=>{
          dragging=true; offX = e.clientX - win.offsetLeft; offY = e.clientY - win.offsetTop;
          win.style.zIndex = ++this.z;
          document.addEventListener("mousemove", onMove);
        });
        document.addEventListener("mouseup",()=>{
          dragging=false; document.removeEventListener("mousemove", onMove);
        });
      }

      _makeResizable(win,resizer){
        let resizing=false, startX=0, startY=0, startW=0, startH=0;
        resizer.addEventListener("mousedown",(e)=>{
          resizing=true; startX=e.clientX; startY=e.clientY; startW=win.offsetWidth; startH=win.offsetHeight;
          document.body.style.cursor='se-resize';
        });
        document.addEventListener("mousemove",(e)=>{
          if(!resizing) return;
          win.style.width = Math.max(280, startW + (e.clientX - startX)) + "px";
          win.style.height= Math.max(180, startH + (e.clientY - startY)) + "px";
        });
        document.addEventListener("mouseup",()=>{ if(resizing){resizing=false; document.body.style.cursor='default'; }});
      }
    }

    class ThemeManager {
      constructor(root){
        this.root = root;
        this.key = "pixelos.theme";
        const saved = localStorage.getItem(this.key) || "teal";
        this.apply(saved);
      }
      apply(name){
        this.root.classList.remove("theme-dark","theme-light");
        if (name === "dark") this.root.classList.add("theme-dark");
        else if (name === "light") this.root.classList.add("theme-light");
        else { /* teal default */ }
        localStorage.setItem(this.key, name);
      }
    }

      processmonitor: {

        init(){

          el.innerHTML = `<div class="app-toolbar"><div>Process Monitor</div></div><div class="app-main"><table><thead><tr><th>PID</th><th>Name</th><th>State</th><th>Prio</th><th>CPU%</th><th>Mem</th><th>MsgQ</th><th>Uptime</th><th>Graph</th></tr></thead><tbody></tbody></table></div>`;
          const tbody = el.querySelector("tbody");
          const iv = setInterval(()=> {
            const rows = Kernel.syscall("process.getAll").map(p=>{
              const uptime = Math.floor((Date.now()-p.startTime)/1000);
              const cpuPercent = p.cpuUsage.totalTicks === 0 ? "0.0" : (((p.cpuUsage.history.filter(v=>v===1).length)/(p.cpuUsage.history.length||1))*100).toFixed(1);
              return `<tr><td>${p.pid}</td><td>${p.name}</td><td>${p.state}</td><td>${p.priority}</td><td>${cpuPercent}%</td><td>${p.memory}MB</td><td>${p.messageQueue.length}</td><td>${uptime}s</td><td><canvas class="sparkline" data-pid="${p.pid}"></canvas></td></tr>`;
            }).join("");
            tbody.innerHTML = rows;
            // draw sparklines
            tbody.querySelectorAll(".sparkline").forEach(cv=>{
              const pid = parseInt(cv.dataset.pid);
              const p = Kernel.syscall("process.get",pid);
              if (!p) return;
              const ctx = cv.getContext("2d");
              cv.width = 60; cv.height = 16;
              ctx.clearRect(0,0,cv.width,cv.height);
              ctx.beginPath(); ctx.strokeStyle="#000080";
              p.cpuUsage.history.forEach((v,i)=>{
                const x = (i/(p.cpuUsage.history.length||1))*cv.width;
                const y = cv.height - (v*cv.height);
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
              });
              ctx.stroke();
            });
          }, 1000);
          return { el, cleanup: ()=>clearInterval(iv) };
        }

      terminal: {
        name:"Terminal",
        icon:'<svg class="desktop-icon-svg" viewBox="0 0 24 24" fill="#33ff33"><path d="M4 5v14h16V5H4zm2 2h12v2H6V7zm0 4h8v2H6v-2z"/></svg>',
        init(){
          const root = document.createElement("div"); root.className="terminal";
          root.innerHTML = `<div class="terminal-output" id="term-out"></div><div class="terminal-input"><span>pixelos&gt;</span><input id="term-in" autocomplete="off"/></div>`;
          const out = root.querySelector("#term-out");
          const input = root.querySelector("#term-in");
          function write(s){ out.innerHTML += s + "\n"; out.scrollTop = out.scrollHeight; }
          write("PixelOS Pro Terminal. Type 'help'");
          input.addEventListener("keydown",(e)=>{
            if (e.key === "Enter"){
              const cmd = input.value.trim(); input.value="";
              write("> " + cmd);
              handle(cmd);
            }
          });
          function handle(cmd){
            if (!cmd) return;
            const parts = cmd.split(" ");
            const c = parts[0].toLowerCase();
            if (c==="help"){ write("help, about, clear, echo <text>, date, ps, top, open <app>, close <app>, prio <pid> <H|N|L>, pub <topic> <text>, fs ls <path>, fs cat <path>, fs write <path> <text>, net offline|online"); }
            else if (c==="about") write("PixelOS Pro — demo OS");
            else if (c==="clear") out.innerHTML="";
            else if (c==="echo") write(parts.slice(1).join(" "));
            else if (c==="date") write(new Date().toString());
            else if (c==="ps"){
              Kernel.syscall("process.getAll").forEach(p => write(`${p.pid}\t${p.name}\t${p.state}\t${p.priority}`));
            } else if (c==="open"){
              const app = parts[1];
              if (app) {
                const key = Object.keys(APPS).find(k=>APPS[k].name.toLowerCase()===app.toLowerCase() || k===app.toLowerCase());
                if (key) UI.windowManager.open(APPS[key]);
                else write("App not found: "+app);
              }
            } else if (c==="close"){
              const app = parts[1];
              if (app){
                const p = Kernel.syscall("process.getAll").find(pp=> pp.name.toLowerCase()===app.toLowerCase() || pp.pid==app);
                if (p) Kernel.syscall("process.terminate", p.pid);
                else write("Process not found.");
              }
            } else if (c==="prio"){
              const pid = parseInt(parts[1]); const pr = parts[2] && parts[2].toUpperCase();
              if (pid && pr) { Kernel.scheduler.setPriority(pid, pr==="H"?"HIGH": pr==="L"?"LOW":"NORMAL"); write("OK"); } else write("usage: prio <pid> <H|N|L>");
            } else if (c==="pub"){
              const topic = parts[1]; const txt = parts.slice(2).join(" ");
              Kernel.ipc.pub(topic, {from:"terminal", text:txt});
              write("published");
            } else if (c==="fs"){
              const sub = parts[1];
              if (sub==="ls"){ write((Kernel.syscall("fs.list", parts[2]||"/") || []).join("\n")); }
              else if (sub==="cat"){ write(Kernel.syscall("fs.read", parts[2]||"") || ""); }
              else if (sub==="write"){ const path = parts[2]; const txt = parts.slice(3).join(" "); Kernel.syscall("fs.write", path, txt); write("written"); }
              else write("fs commands: ls <path>, cat <path>, write <path> <text>");
            } else if (c==="net"){
              if (parts[1]==="offline") Kernel.ipc.pub("net.toggle",{offline:true});
              else Kernel.ipc.pub("net.toggle",{offline:false});
              write("toggled network");
            } else write("Unknown command");
          }
          return { el: root, cleanup: ()=>{} };
        }
      },

      settings: {
        name:"Settings",
        icon:'<svg class="desktop-icon-svg" viewBox="0 0 24 24" fill="#9e9e9e"><path d="M19.43 12.98c.04-.32..."/></svg>',

    /* ---------------------------
       UI Glue
       --------------------------- */
    const UI = {
      windowManager: null,
      themeManager: null,
      init(){
        this.themeManager = new ThemeManager(document.body);
        this.windowManager = new WindowManager(document.getElementById("screen"), document.getElementById("taskbar"), Kernel.processManager);
        // store to Kernel.ui
        Kernel.ui = this;
        this.setupListeners();
      },
      setupListeners(){
        const desktop = document.getElementById("desktop-icons");
        const startBtn = document.getElementById("start-button");
        const startMenu = document.getElementById("start-menu");
        const tasks = document.getElementById("tasks-container");

        // double click/dbl open
        desktop.addEventListener("dblclick", (e)=>{
          const icon = e.target.closest(".desktop-icon"); if (!icon) return;
          const appId = icon.dataset.appid; if (!appId) return;
          UI.windowManager.open(APPS[appId]);
        });

        // keyboard enter to open
        desktop.addEventListener("keydown",(e)=>{
          if (e.key==="Enter"){
            const icon = e.target.closest(".desktop-icon"); if (!icon) return;
            const appId = icon.dataset.appid; if (!appId) return;
            UI.windowManager.open(APPS[appId]);
          }
        });

        // start menu
        startBtn.addEventListener("click",(ev)=>{
          const expanded = startBtn.getAttribute("aria-expanded")==="true";
          startBtn.setAttribute("aria-expanded", (!expanded).toString());
          startMenu.style.display = expanded ? "none" : "flex";
        });

        startMenu.addEventListener("click",(e)=>{
          const btn = e.target.closest("button"); if (!btn) return;
          const act = btn.dataset.action;
          if (act === "open-app") UI.windowManager.open(APPS[btn.dataset.appid]);
          if (act === "shutdown") {
            UI.showModal("Shut down PixelOS Pro?", ()=>{
              Kernel.shutdown().then(()=> { document.getElementById("screen").style.display="none"; document.getElementById("shutdown-screen").style.display="flex"; });
            });
          }
          startMenu.style.display = "none";
        });

        // taskbar clicks handled by windowManager via dataset pid button listeners - tasks are appended there

        // ESC topmost close
        document.addEventListener("keydown",(e)=>{
          if (e.key === "Escape") {
            const top = UI.windowManager.getTopmostPID();
            if (top) UI.windowManager.close(top);
          }
        });
      },

      showModal(text, onConfirm){
        const overlay = document.createElement("div"); overlay.className = "modal-overlay"; overlay.style.zIndex = 20000;
        overlay.innerHTML = `<div class="modal-content"><p>${text}</p><div style="margin-top:12px"><button id="modal-ok">OK</button><button id="modal-cancel">Cancel</button></div></div>`;
        document.body.appendChild(overlay);
        overlay.querySelector("#modal-ok").onclick = ()=> { onConfirm(); overlay.remove(); };
        overlay.querySelector("#modal-cancel").onclick = ()=> overlay.remove();
      },

      initDesktopIcons(){
        const container = document.getElementById("desktop-icons");
        container.innerHTML = "";
        Object.keys(APPS).forEach(k=>{
          const app = APPS[k];
          const div = document.createElement("div");
          div.className = "desktop-icon";
          div.setAttribute("role","button");
          div.setAttribute("tabindex","0");
          div.setAttribute("aria-label", "Open " + app.name);
          div.dataset.appid = k;
          div.innerHTML = `${app.icon}<span>${app.name}</span>`;
          container.appendChild(div);
        });
      }
    };

    /* ---------------------------
       Boot sequence & startup
       --------------------------- */
    function bootSequence(){
      const bootLog = document.getElementById("boot-log");
      const msgs = [
        "Boot ROM check...",
        "Memory test (64KB)...",
        "Loading Kernel...",
        "Initializing Scheduler...",
        "Mounting File System...",
        "Starting Services...",
        "Initializing UI...",
        "PixelOS Pro Ready"
      ];
      let i = 0;
      const iv = setInterval(()=>{
        if (i < msgs.length) {
          const d = document.createElement("div");
          d.textContent = `> ${msgs[i]} OK`;
          bootLog.appendChild(d);
          bootLog.scrollTop = bootLog.scrollHeight;
          i++;
        } else {
          clearInterval(iv);
          startDesktop();
        }
      }, Math.random()*200 + 120);

      document.getElementById("skip-boot-button").onclick = ()=> { clearInterval(iv); startDesktop(); };
      document.addEventListener("keydown",(e)=>{
        if (e.key === "Enter" && document.getElementById("boot-screen").style.display !== "none") {
          clearInterval(iv); startDesktop();
        }
      }, { once:true });
    }

    function startDesktop(){
      document.getElementById("boot-screen").style.display = "none";
      document.getElementById("screen").style.display = "block";
      // start kernel and UI
      Kernel.boot().then(()=> {
        UI.init();
        UI.initDesktopIcons();
        // init window manager & taskbar are done in UI.init
        // update clock
        updateClock(); setInterval(updateClock, 1000);
        // replay any queued logs
        (Kernel.logQueue||[]).forEach(l=> Kernel.ipc.pub("kernel.log", l));
        Kernel.logQueue = [];
      });
    }

    function updateClock(){
      const c = document.getElementById("clock");
      if (c) c.textContent = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    /* ---------------------------
       Start boot
       --------------------------- */
    bootSequence();

    // Expose globals for debug/interactive console if needed (safe)
    window.PixelOS = { Kernel, UI, APPS };

  })();
  </script>
</body>
</html>
